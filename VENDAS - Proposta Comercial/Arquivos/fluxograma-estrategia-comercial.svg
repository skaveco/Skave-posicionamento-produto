<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#087b78"/></marker></defs><rect width="1600" height="1350" fill="#f3f6f8"/><g font-family="Arial, sans-serif" fill="#172532">
<text x="60" y="66" font-size="42" font-weight="700" fill="#172532">Estratégia comercial da Skave</text>
<text x="60" y="109" font-size="25" font-weight="400" fill="#172532">Posicionamento de Marca para SaaS B2B que já vende</text>
<rect x="60" y="151" width="1480" height="112" rx="16" fill="#e3f3f1" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="188" font-size="24" font-weight="700" fill="#172532">PRIORIDADE: ATRAIR O EMPRESÁRIO CERTO PARA O PERFIL</text>
<text x="84" y="222" font-size="19" font-weight="400" fill="#4f6171">Donos e sócios de SaaS B2B com produto validado, clientes ativos e operação rodando.</text>
<text x="84" y="251" font-size="19" font-weight="400" fill="#4f6171">Contexto: a marca não deixa claros o valor do software, seu público e sua diferença.</text>
<rect x="60" y="301" width="980" height="113" rx="16" fill="#ffffff" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="338" font-size="24" font-weight="700" fill="#172532">1. Conteúdo frequente</text>
<text x="84" y="372" font-size="19" font-weight="400" fill="#4f6171">Situações do SaaS: clareza, diferenciação e coerência.</text>
<text x="84" y="401" font-size="19" font-weight="400" fill="#4f6171">Medir a entrada de seguidores com o perfil desejado.</text>
<path d="M550,263 L550,301" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="461" width="470" height="145" rx="16" fill="#ffffff" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="498" font-size="24" font-weight="700" fill="#172532">2. Seguidores com perfil</text>
<text x="84" y="532" font-size="19" font-weight="400" fill="#4f6171">Identificar donos e sócios de SaaS B2B.</text>
<text x="84" y="561" font-size="19" font-weight="400" fill="#4f6171">Iniciar uma conversa a partir de</text>
<text x="84" y="590" font-size="19" font-weight="400" fill="#4f6171">uma observação concreta.</text>
<rect x="570" y="461" width="470" height="145" rx="16" fill="#ffffff" stroke="#bddbd9" stroke-width="2"/>
<text x="594" y="498" font-size="24" font-weight="700" fill="#172532">3. Interesse em materiais</text>
<text x="594" y="532" font-size="19" font-weight="400" fill="#4f6171">Etapa posterior: iscas nos conteúdos.</text>
<text x="594" y="561" font-size="19" font-weight="400" fill="#4f6171">Abordar quem tem perfil e interesse;</text>
<text x="594" y="590" font-size="19" font-weight="400" fill="#4f6171">o material não comprova intenção de compra.</text>
<path d="M300,414 L300,461" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M800,414 L800,461" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="655" width="980" height="109" rx="16" fill="#ffffff" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="692" font-size="24" font-weight="700" fill="#172532">4. Conversa e convite para call</text>
<text x="84" y="726" font-size="19" font-weight="400" fill="#4f6171">Confirmar a dor e sua prioridade.</text>
<text x="84" y="755" font-size="19" font-weight="400" fill="#4f6171">Mudança comercial não é requisito para selecionar o lead.</text>
<path d="M300,606 L300,655" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M800,606 L800,655" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="814" width="980" height="109" rx="16" fill="#ffffff" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="851" font-size="24" font-weight="700" fill="#172532">5. Call: Posicionamento de Marca completo</text>
<text x="84" y="885" font-size="19" font-weight="400" fill="#4f6171">Indicar Lauch ou Evolution conforme o diagnóstico da marca.</text>
<text x="84" y="914" font-size="19" font-weight="400" fill="#4f6171">Start: downsell apenas se o escopo reduzido atender à necessidade.</text>
<path d="M550,764 L550,814" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="973" width="980" height="109" rx="16" fill="#ffffff" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="1010" font-size="24" font-weight="700" fill="#172532">6. Proposta, contrato e projeto</text>
<text x="84" y="1044" font-size="19" font-weight="400" fill="#4f6171">Executar o escopo do plano indicado: Lauch ou Evolution.</text>
<text x="84" y="1073" font-size="19" font-weight="400" fill="#4f6171">Acompanhamento pós-projeto; Start mantém o escopo reduzido.</text>
<path d="M550,923 L550,973" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="1132" width="980" height="145" rx="16" fill="#fff3e8" stroke="#bddbd9" stroke-width="2"/>
<text x="84" y="1169" font-size="24" font-weight="700" fill="#172532">Adicionais conforme a necessidade</text>
<text x="84" y="1203" font-size="19" font-weight="400" fill="#4f6171">Naming: definir antes da identidade, com escopo e preço próprios.</text>
<text x="84" y="1232" font-size="19" font-weight="400" fill="#4f6171">Site ou landing page: proposta inicial ou posterior, com preço próprio.</text>
<text x="84" y="1261" font-size="19" font-weight="400" fill="#4f6171">Implementação digital após a definição da marca.</text>
<path d="M550,1082 L550,1132" stroke="#087b78" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="1090" y="301" width="450" height="199" rx="16" fill="#fff3e8" stroke="#bddbd9" stroke-width="2"/>
<text x="1114" y="338" font-size="24" font-weight="700" fill="#172532">Demanda espontânea</text>
<text x="1114" y="372" font-size="19" font-weight="400" fill="#4f6171">Pedido pontual de site, landing page,</text>
<text x="1114" y="401" font-size="19" font-weight="400" fill="#4f6171">naming ou outro serviço.</text>
<text x="1114" y="430" font-size="19" font-weight="400" fill="#4f6171">Avaliar necessidade, escopo e viabilidade.</text>
<text x="1114" y="459" font-size="19" font-weight="400" fill="#4f6171">Proposta independente.</text>
<rect x="1090" y="550" width="450" height="174" rx="16" fill="#e3f3f1" stroke="#bddbd9" stroke-width="2"/>
<text x="1114" y="587" font-size="24" font-weight="700" fill="#172532">Critério para uma pauta</text>
<text x="1114" y="621" font-size="19" font-weight="400" fill="#4f6171">O dono de SaaS reconhece uma</text>
<text x="1114" y="650" font-size="19" font-weight="400" fill="#4f6171">situação da própria empresa e</text>
<text x="1114" y="679" font-size="19" font-weight="400" fill="#4f6171">entende por que vale acompanhar</text>
<text x="1114" y="708" font-size="19" font-weight="400" fill="#4f6171">o perfil?</text>
<text x="60" y="1310" font-size="18" font-weight="400" fill="#4f6171">SKAVE | Direção comercial de trabalho | Outubro de 2026</text>
</g></svg>